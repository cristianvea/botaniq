name: Avisos de riego

on:
  schedule:
    # Cada hora; el script solo avisa a quien le toca a esa hora (la elige cada uno en la app)
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no envía nada)'
        type: boolean
        default: false
      force:
        description: 'Enviar ya a todos, sin esperar a su hora'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          export APP_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          node scripts/notify.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
