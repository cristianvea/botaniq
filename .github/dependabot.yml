# Revisa cada semana si hay versiones nuevas (sobre todo parches de seguridad) de las librerías y de las acciones de GitHub
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
